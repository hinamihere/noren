name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          modules: 'qtsvg'

      - name: Build
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake --build build

      - name: Deploy Qt DLLs
        run: |
          windeployqt build/noren.exe
          windeployqt build/noren-cli.exe

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item build/noren.exe staging/
          Copy-Item build/noren-cli.exe staging/
          Copy-Item build/*.dll staging/
          Get-ChildItem -Path build -Directory | Where-Object { $_.Name -notin @('CMakeFiles', '_deps') } | Copy-Item -Destination staging/ -Recurse -Force
          Compress-Archive -Path staging/* -DestinationPath noren-v0.1.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noren-v0.1
          path: noren-v0.1.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: noren-v0.1.zip
          generate_release_notes: true
